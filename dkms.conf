PACKAGE_NAME="asustor-platform-driver"
PACKAGE_VERSION="0.3.0"
AUTOINSTALL="yes"

# dkms builds through Kbuild with its default make command. Debian, Ubuntu,
# Arch, Fedora and SUSE ignore DEST_MODULE_LOCATION and use their own
# directory for DKMS modules.
BUILT_MODULE_NAME[0]="asustor"
DEST_MODULE_LOCATION[0]="/kernel/drivers/platform/x86"
BUILT_MODULE_NAME[1]="asustor_it87"
DEST_MODULE_LOCATION[1]="/kernel/drivers/hwmon"
BUILT_MODULE_NAME[2]="asustor_gpio_it87"
DEST_MODULE_LOCATION[2]="/kernel/drivers/gpio"
